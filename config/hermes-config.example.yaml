# Это ориентир структуры, а не файл для слепого копирования.
# Создайте актуальный конфиг через `hermes setup`, затем сверяйте его
# с официальной документацией установленной версии.

terminal:
  # Для первого запуска безопаснее docker; local даёт агенту права пользователя VPS.
  backend: docker

# SOUL.md хранится в HERMES_HOME, обычно ~/.hermes/SOUL.md.
# Проектные правила хранятся в рабочей папке как AGENTS.md.

# Подключайте только одобренные клиентом MCP-серверы.
# Не добавляйте сюда ключи: используйте ~/.hermes/.env.
mcp_servers: {}

